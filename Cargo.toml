[package]
edition = "2021"
name = "everscan-verify"
version = "1.6.18"

[dependencies]
anyhow = { version = "1.0.98", features = ["backtrace"] }
base64 = "0.22.1"
clap = { version = "4.5.36", features = ["derive"] }
comfy-table = "7.1.4"
crossterm = "0.29"
dialoguer = { version = "0.11.0" }
hex = "0.4.3"
hmac-sha256 = "1.1.8"
pathdiff = "0.2.3"
pest = "2.8"
pest_derive = "2.8"
semver = "1.0.26"
serde_json = "1.0.140"
spinners = { version = "4.1.1" }
reqwest = { version = "0.12.15", default-features = false, features = ["blocking", "json", "native-tls", "gzip"] }
walkdir = "2.5.0"
colour = "2.1.0"
openssl = { version = "0.10.72", features = ["vendored"] }
os_str_bytes = { version = "7.1.0", features = ["conversions"] }
path-slash = "0.2.1"
spdx = "0.10.8"
ariadne = "0.3"
signal-hook = "0.3.17"

[dependencies.serde]
features = ["derive"]
version = "1.0.219"

[dependencies.shared-models]
path = "shared-models"

[workspace]
members = ["shared-models"]

[profile.release]
lto = true
strip = "symbols"
codegen-units = 1
