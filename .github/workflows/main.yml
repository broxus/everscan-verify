on:
  push:
    tags:

name: Release

env:
  RELEASE_BIN: everscan-verify
  RELEASE_DIR: artifacts
  MACOS_TARGET: x86_64-apple-darwin
  LINUX_TARGET: x86_64-unknown-linux-musl
  WINDOWS_TARGET: x86_64-pc-windows-msvc
  RELEASE_ADDS: README.md

jobs:
  build:
    name: Build artifacts (${{ matrix.build }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: linux
            os: ubuntu-latest
            rust: stable
            target: ${{ env.LINUX_TARGET }}
            archive_ext: tar.gz
          - build: macos
            os: macos-latest
            rust: stable
            target: ${{ env.MACOS_TARGET }}
            archive_ext: tar.gz
          - build: windows
            os: windows-latest
            rust: stable
            target: ${{ env.WINDOWS_TARGET }}
            archive_ext: zip
          - build: everscan-verifyjs
            os: ubuntu-latest
            archive_ext: tar.gz

    outputs:
      version: ${{ steps.get_version.outputs.version }}
      linux_artifact_name: ${{ env.RELEASE_BIN }}-${{ steps.get_version.outputs.version }}-${{ env.LINUX_TARGET }}.tar.gz
      macos_artifact_name: ${{ env.RELEASE_BIN }}-${{ steps.get_version.outputs.version }}-${{ env.MACOS_TARGET }}.tar.gz
      windows_artifact_name: ${{ env.RELEASE_BIN }}-${{ steps.get_version.outputs.version }}-${{ env.WINDOWS_TARGET }}.zip
      js_artifact_name: everscan-verifyjs-${{ steps.get_version.outputs.version }}.tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Rust dependencies
        if: matrix.rust
        uses: Swatinem/rust-cache@v2

      - name: Get version from tag
        id: get_version
        shell: bash
        run: |
          VERSION_TAG="${GITHUB_REF#refs/tags/}"
          echo "Using version tag: $VERSION_TAG"
          echo "version=$VERSION_TAG" >> $GITHUB_OUTPUT

      - name: Install Rust toolchain
        if: matrix.rust
        run: |
          rustup update ${{ matrix.rust }} --no-self-update
          rustup default ${{ matrix.rust }}
          if [[ "${{ matrix.target }}" != "" && "$(rustc -vV | grep host)" != *"${{ matrix.target }}"* ]]; then
             rustup target add ${{ matrix.target }}
          fi

      - name: Install build dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -y
          if [[ "${{ matrix.build }}" == "linux" ]]; then
            sudo apt-get install -y musl-tools
          fi
          sudo apt-get install -y p7zip-full

      - name: Install build dependencies (MacOS)
        if: matrix.os == 'macos-latest'
        run: brew install p7zip

      - name: Build Rust Binary
        if: matrix.rust
        run: cargo build --release --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-Ctarget-feature=+crt-static' || '' }}

      - name: Prepare artifact directory structure
        shell: bash
        run: |
          mkdir -p dist


      - name: Package artifact (Linux)
        if: matrix.build == 'linux'
        shell: bash
        run: |
          cp ./target/${{ matrix.target }}/release/${{ env.RELEASE_BIN }} ./dist/
          cp ${{ env.RELEASE_ADDS }} ./dist/
          ARTIFACT_NAME="${{ env.RELEASE_BIN }}-${{ steps.get_version.outputs.version }}-${{ matrix.target }}.${{ matrix.archive_ext }}"
          pushd dist
          7z a -ttar -so -an * | 7z a -si ../${ARTIFACT_NAME}
          popd
          echo "Created ${ARTIFACT_NAME}"

      - name: Package artifact (MacOS)
        if: matrix.build == 'macos'
        shell: bash
        run: |
          cp ./target/${{ matrix.target }}/release/${{ env.RELEASE_BIN }} ./dist/
          cp ${{ env.RELEASE_ADDS }} ./dist/
          ARTIFACT_NAME="${{ env.RELEASE_BIN }}-${{ steps.get_version.outputs.version }}-${{ matrix.target }}.${{ matrix.archive_ext }}"
          pushd dist
          7z a -ttar -so -an * | 7z a -si ../${ARTIFACT_NAME}
          popd
          echo "Created ${ARTIFACT_NAME}"

      - name: Package artifact (Windows)
        if: matrix.build == 'windows'
        shell: bash
        run: |
          cp ./target/${{ matrix.target }}/release/${{ env.RELEASE_BIN }}.exe ./dist/
          cp ${{ env.RELEASE_ADDS }} ./dist/
          ARTIFACT_NAME="${{ env.RELEASE_BIN }}-${{ steps.get_version.outputs.version }}-${{ matrix.target }}.${{ matrix.archive_ext }}"
          pushd dist
          7z a -tzip ../${ARTIFACT_NAME} *
          popd
          echo "Created ${ARTIFACT_NAME}"

      - name: Package artifact (everscan-verifyjs)
        if: matrix.build == 'everscan-verifyjs'
        shell: bash
        run: |
          ARTIFACT_NAME="everscan-verifyjs-${{ steps.get_version.outputs.version }}.${{ matrix.archive_ext }}"
          pushd everscan-verifyjs # Assuming this is the source directory
          7z a -ttar -so -an . | 7z a -si ../${ARTIFACT_NAME}
          popd
          echo "Created ${ARTIFACT_NAME}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.build }}-artifact
          # Construct the path based on the build type
          path: |
            ${{ matrix.build == 'linux' && format('{0}-{1}-{2}.{3}', env.RELEASE_BIN, steps.get_version.outputs.version, matrix.target, matrix.archive_ext) || '' }}
            ${{ matrix.build == 'macos' && format('{0}-{1}-{2}.{3}', env.RELEASE_BIN, steps.get_version.outputs.version, matrix.target, matrix.archive_ext) || '' }}
            ${{ matrix.build == 'windows' && format('{0}-{1}-{2}.{3}', env.RELEASE_BIN, steps.get_version.outputs.version, matrix.target, matrix.archive_ext) || '' }}
            ${{ matrix.build == 'everscan-verifyjs' && format('everscan-verifyjs-{0}.{1}', steps.get_version.outputs.version, matrix.archive_ext) || '' }}
          retention-days: 5

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required by softprops/action-gh-release to create/update releases and upload assets

    steps:
      - name: Get version from tag
        id: get_version
        shell: bash
        run: |
          VERSION_TAG="${GITHUB_REF#refs/tags/}"
          echo "Using version tag: $VERSION_TAG"
          echo "version=$VERSION_TAG" >> $GITHUB_OUTPUT

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
      - name: List downloaded files
        run: ls -R

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Use the version derived from the tag
          tag_name: ${{ steps.get_version.outputs.version }}
          # Optional: Use tag name as release name, or customize
          name: Release ${{ steps.get_version.outputs.version }}
          # Optional: Generate release notes from commits
          generate_release_notes: false
          files: |
            linux-artifact/${{ env.RELEASE_BIN }}-${{ steps.get_version.outputs.version }}-${{ env.LINUX_TARGET }}.tar.gz
            macos-artifact/${{ env.RELEASE_BIN }}-${{ steps.get_version.outputs.version }}-${{ env.MACOS_TARGET }}.tar.gz
            windows-artifact/${{ env.RELEASE_BIN }}-${{ steps.get_version.outputs.version }}-${{ env.WINDOWS_TARGET }}.zip
            everscan-verifyjs-artifact/everscan-verifyjs-${{ steps.get_version.outputs.version }}.tar.gz

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}